[package]
name = "raecli2"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "cookies", "gzip", "brotli", "deflate"] }
clap = { version = "4.0", features = ["derive"] }
scraper = "0.18"
urlencoding = "2.1"
headless_chrome = "1.0.17"
colored = "2.1.0"
flate2 = "1.0"
encoding_rs = "0.8"
# Dependencias para GIF recording
image = "0.25"
gif = "0.13"
crossterm = "0.28"
anyhow = "1.0"
tokio = { version = "1.0", features = ["time"] }

# TLS fingerprinting experimental (comentadas)
# gnutls = "0.1.3"            # GNUTLS bindings para Rust
# ja3 = "0.5.1"               # JA3 fingerprinting
# tls-parser = "0.12"         # Parser de TLS para análisis
