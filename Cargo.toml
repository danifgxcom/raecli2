[package]
name = "raecli2"
version = "0.2.0"
edition = "2021"

[lib]
name = "raecli2"
path = "src/lib.rs"

[[bin]]
name = "raecli2"
path = "src/main.rs"


[[bin]]
name = "test_html_parsing"
path = "src/test_html_parsing.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "cookies", "gzip", "brotli", "deflate"] }
clap = { version = "4.0", features = ["derive"] }
scraper = "0.23"
urlencoding = "2.1"
colored = "3.0"
flate2 = "1.0"
encoding_rs = "0.8"
anyhow = "1.0"

rustls = "0.23"
webpki = "0.22.0"
webpki-roots = "1.0"
url = "2.3.1"

[dev-dependencies]
mockall = "0.11"
tempfile = "3.8"
assert_matches = "1.5"

[features]
default = []
